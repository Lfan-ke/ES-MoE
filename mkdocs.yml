site_name: esmoe
site_description: Drop-in ES-MoE block for Ultralytics YOLO - installable, budget-fair, aux-loss aware.
repo_url: https://github.com/Lfan-ke/ES-MoE
edit_uri: blob/main/docs/

theme:
  name: material
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      toggle: { icon: material/weather-night, name: Dark mode }
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      toggle: { icon: material/weather-sunny, name: Light mode }
  features:
    - navigation.sections
    - content.code.copy

plugins:
  - search
  - i18n:
      docs_structure: suffix
      languages:
        - locale: en
          default: true
          name: English
          build: true
        - locale: zh
          name: 中文
          build: true
          nav_translations:
            Overview: 概览
            Tutorial: 教程
            Selection: 选型
            Limitations: 已知局限
            Baseline and increment: 基线与增量
            Mid-term report: 中期报告

nav:
  - Overview: index.md
  - Tutorial: tutorial.md
  - Selection: SELECTION.md
  - Limitations: limitations.md
  - Baseline and increment: BASELINE.md
  - Mid-term report: MIDTERM.md
  - Release 0.1.1: RELEASE_v0.1.1.md
  - Release 0.1.0: RELEASE_v0.1.0.md
  - Roadmap: ROADMAP.md

markdown_extensions:
  - admonition
  - tables
  - toc: { permalink: true }
  - pymdownx.snippets:
      base_path: ['.']
  - pymdownx.arithmatex:
      generic: true
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format

extra_javascript:
  - https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-mml-chtml.js
