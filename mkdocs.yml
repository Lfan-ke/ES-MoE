site_name: ES-MoE
site_url: https://lfan-ke.github.io/ES-MoE/
site_description: Drop-in expert-sparse MoE block for Ultralytics YOLO, with a router loss that reaches the optimiser.
repo_url: https://github.com/Lfan-ke/ES-MoE
edit_uri: blob/main/docs/

theme:
  name: material
  logo: assets/logo.svg
  favicon: assets/logo.svg
  font:
    text: Source Sans 3
    code: JetBrains Mono
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      toggle: { icon: material/weather-night, name: Dark mode }
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      toggle: { icon: material/weather-sunny, name: Light mode }
  features:
    - navigation.sections
    - navigation.top
    - toc.follow
    - content.code.copy
    - search.suggest

hooks:
  - hooks/urls.py

extra_css:
  - stylesheets/extra.css

plugins:
  - search
  - i18n:
      docs_structure: suffix
      languages:
        - locale: zh
          default: true
          name: 中文
          build: true
        - locale: en
          name: English
          build: true
          nav_translations:
            概览: Overview
            教程: Tutorial
            选型: Selection
            实验结果: Results
            已知局限: Limitations
            基线与增量: Baseline and increment
            中期报告: Mid-term report
            上游 PR 草稿: Upstream PR draft

nav:
  - 概览: index.md
  - 教程: tutorial.md
  - 选型: SELECTION.md
  - 实验结果: results.md
  - 已知局限: limitations.md
  - 基线与增量: BASELINE.md
  - 中期报告: MIDTERM.md
  - 上游 PR 草稿: PR_DRAFT.md
  - Release 0.1.3: RELEASE_v0.1.3.md
  - Release 0.1.2: RELEASE_v0.1.2.md
  - Release 0.1.1: RELEASE_v0.1.1.md
  - Release 0.1.0: RELEASE_v0.1.0.md

markdown_extensions:
  - admonition
  - attr_list
  - md_in_html
  - tables
  - toc: { permalink: true }
  - pymdownx.snippets:
      base_path: ['.']
  - pymdownx.arithmatex:
      generic: true
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid-chart
          format: !!python/name:pymdownx.superfences.fence_code_format

extra_javascript:
  - https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-mml-chtml.js
  - https://cdn.jsdelivr.net/npm/mermaid@11/dist/mermaid.min.js
  - javascripts/diagrams.js
