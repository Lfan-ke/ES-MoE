name: Canary

# Installs the published package - not this checkout - into a clean environment and runs the
# documented quick start. It answers "does `pip install esmoe` still work today", which the CI on
# source cannot answer, and catches an upstream ultralytics release breaking users before they do.
on:
  schedule:
    - cron: "0 3 1,15 * *"
  workflow_dispatch:

jobs:
  published:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v7
        with:
          python-version: "3.12"
      - name: Install the published package
        run: |
          uv venv
          uv pip install torch torchvision --index-url https://download.pytorch.org/whl/cpu
          uv pip install esmoe nbclient ipykernel nbformat pandas
      - name: Report what got installed
        run: uv run --no-sync esmoe info
      - name: Run the documented quick start
        run: uv run --no-sync python scripts/check_notebook.py

  fork:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
          python-version: "3.12"
      # The locked environment carries a torch/torchvision pair the test matrix already proves;
      # installing the fork with --no-deps swaps only the ultralytics code underneath it.
      - run: uv sync --group dev
      - name: Swap in YOLO-Master's vendored ultralytics
        run: uv pip install --no-deps "git+https://github.com/Tencent/YOLO-Master"
      - name: esmoe on the fork
        run: uv run --no-sync python scripts/fork_smoke.py
