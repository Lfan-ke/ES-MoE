name: Docs

on:
  push:
    branches: [main]
    paths: ["docs/**", ".github/docs/**", "results/*.md", "pyproject.toml", ".github/workflows/docs.yml"]
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      version:
        description: "Redeploy main as this released version (latest moves only for the newest tag); empty deploys dev"
        required: false
        default: ""

permissions:
  contents: write

concurrency:
  group: gh-pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      # main is `dev`. The site keeps one version per x.y: an x.y.0 release publishes it and a patch release
      # adds nothing, its changes already being on `dev`. A manual run redeploys an x.y from main.
      VERSION: ${{ github.event_name == 'release' && github.event.release.tag_name || inputs.version || 'dev' }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
          python-version: "3.12"
      - run: uv sync --group dev
      - name: Check a manual run
        # A manual run builds main, which carries the newest series; under any other name those pages would be mislabelled.
        if: github.event_name == 'workflow_dispatch'
        run: |
          [ "$GITHUB_REF" = refs/heads/main ] || { echo "manual runs deploy from main only, not $GITHUB_REF"; exit 1; }
          if [ "$VERSION" = dev ]; then exit 0; fi
          series=$(echo "${VERSION#v}" | cut -d. -f1,2)
          newest=$(git tag -l 'v*' --sort=-v:refname | head -1 | sed 's/^v//' | cut -d. -f1,2)
          git rev-parse -q --verify "refs/tags/v$series.0" > /dev/null || { echo "no tag v$series.0"; exit 1; }
          [ "$series" = "$newest" ] || { echo "main carries the $newest docs, not $series"; exit 1; }
      - name: Deploy the version
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git fetch origin gh-pages:gh-pages
          series=$(echo "${VERSION#v}" | cut -d. -f1,2)
          patch=$(echo "${VERSION#v}" | cut -d. -f3)
          newest=$(git tag -l 'v*' --sort=-v:refname | head -1 | sed 's/^v//' | cut -d. -f1,2)
          if [ "$VERSION" = dev ]; then
            uv run mike deploy -F .github/docs/mkdocs.yml --push dev
          elif [ "${patch:-0}" != 0 ] && [ "${{ github.event_name }}" = release ]; then
            echo "patch release ${VERSION#v}: its documentation is on dev"
          elif [ "$series" = "$newest" ]; then
            uv run mike deploy -F .github/docs/mkdocs.yml --push --update-aliases "$series" latest
            uv run mike set-default -F .github/docs/mkdocs.yml --push latest
          else
            uv run mike deploy -F .github/docs/mkdocs.yml --push "$series"
          fi
      - name: Point the unversioned addresses at latest
        run: |
          git worktree add ../pages gh-pages
          uv run python .github/docs/stubs.py ../pages
          cd ../pages
          git add -A
          git diff --cached --quiet || { git commit -qm "Point unversioned addresses at latest"; git push origin gh-pages; }
