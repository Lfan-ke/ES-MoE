name: Docs

on:
  push:
    branches: [main]
    paths: ["docs/**", ".github/docs/**", "results/*.md", "pyproject.toml", ".github/workflows/docs.yml"]
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      version:
        description: "Redeploy main as this released version (latest moves only for the newest tag); empty deploys dev"
        required: false
        default: ""

permissions:
  contents: write

concurrency:
  group: gh-pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      # main is `dev`; a release gets its own version and takes `latest`, which the site opens on. A manual run
      # can redeploy a released version from main when only its documentation changed.
      VERSION: ${{ github.event_name == 'release' && github.event.release.tag_name || inputs.version || 'dev' }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
          python-version: "3.12"
      - run: uv sync --group dev
      - name: Check a manual redeploy
        # A typo would otherwise publish a phantom version, and an older tag would drag `latest` backwards.
        if: github.event_name == 'workflow_dispatch' && inputs.version != ''
        run: |
          [ "$GITHUB_REF" = refs/heads/main ] || { echo "redeploy from main only, not $GITHUB_REF"; exit 1; }
          git rev-parse -q --verify "refs/tags/v${VERSION#v}" > /dev/null || { echo "no tag v${VERSION#v}"; exit 1; }
      - name: Deploy the version
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git fetch origin gh-pages:gh-pages
          newest=$(git tag -l 'v*' --sort=-v:refname | head -1)
          if [ "$VERSION" = dev ]; then
            uv run mike deploy -F .github/docs/mkdocs.yml --push dev
          elif [ "v${VERSION#v}" = "$newest" ]; then
            uv run mike deploy -F .github/docs/mkdocs.yml --push --update-aliases "${VERSION#v}" latest
            uv run mike set-default -F .github/docs/mkdocs.yml --push latest
          else
            uv run mike deploy -F .github/docs/mkdocs.yml --push "${VERSION#v}"
          fi
      - name: Point the unversioned addresses at latest
        run: |
          git worktree add ../pages gh-pages
          uv run python .github/docs/stubs.py ../pages
          cd ../pages
          git add -A
          git diff --cached --quiet || { git commit -qm "Point unversioned addresses at latest"; git push origin gh-pages; }
