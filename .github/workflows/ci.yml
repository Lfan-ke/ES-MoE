name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-26.04
    strategy:
      fail-fast: false
      matrix:
        python: ["3.12", "3.13"]
        # The project claims to work across ultralytics releases that report loss items differently,
        # so the older shape is tested on every push rather than trusted. No lock file is tracked, so
        # `latest` is whatever resolves that day and a breaking ultralytics release fails here first.
        ultralytics: [latest, "8.4.101"]
    name: test (py${{ matrix.python }}, ultralytics ${{ matrix.ultralytics }})
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
          python-version: ${{ matrix.python }}
      - run: uv sync --group dev
      - name: Pin ultralytics
        if: matrix.ultralytics != 'latest'
        run: uv pip install "ultralytics==${{ matrix.ultralytics }}"
      - name: Lint
        if: matrix.ultralytics == 'latest'
        run: |
          uv run --no-sync ruff check .
          uv run --no-sync ruff format --check .
      - name: Build the docs site
        # A broken page or nav entry would otherwise fail only in the deploy after merge.
        if: matrix.ultralytics == 'latest' && matrix.python == '3.12'
        run: uv run --no-sync mkdocs build --strict -f .github/docs/mkdocs.yml
      - name: Test
        run: uv run --no-sync pytest -q

  core:
    name: torch alone
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
          python-version: "3.13"
      - run: uv sync --group check --no-group dev
      - name: No integration installed
        run: uv run --no-sync python -c "import importlib.util, sys; sys.exit(importlib.util.find_spec('ultralytics') is not None)"
      - name: Test
        run: uv run --no-sync pytest tests/test_torch.py -q

  native:
    name: ${{ matrix.backend }} alone
    runs-on: ubuntu-26.04
    strategy:
      fail-fast: false
      matrix:
        backend: [tensorflow, jax, flax]
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
          python-version: "3.13"
      - run: uv sync --group check --no-group dev --extra ${{ matrix.backend }}
      - name: The backend names no other framework
        # tensorflow imports keras on its own; what matters is that this backend does not reach for it.
        run: uv run --no-sync python -c "import pathlib, sys; src = ''.join(p.read_text() for p in pathlib.Path('esmoe/${{ matrix.backend }}').glob('*.py')); sys.exit('keras' in src or 'ultralytics' in src)"
      - name: Test
        run: uv run --no-sync pytest tests/test_${{ matrix.backend }}.py -q

  keras:
    name: keras on ${{ matrix.backend }}
    runs-on: ubuntu-26.04
    strategy:
      fail-fast: false
      matrix:
        backend: [tensorflow, jax, torch]
    env:
      KERAS_BACKEND: ${{ matrix.backend }}
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
          python-version: "3.13"
      - run: uv sync --group check --no-group dev --extra keras --extra ${{ matrix.backend }}
      - name: Test
        run: uv run --no-sync pytest tests/test_keras.py tests/test_backends.py -q

  verify:
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
          python-version: "3.12"
      - run: uv sync --group dev
      - name: Correctness checks on real runs
        run: uv run --no-sync python scripts/verify.py

  notebook:
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
          python-version: "3.12"
      - run: uv sync --group dev
      - name: Execute the quick start on CPU
        run: uv run --no-sync python scripts/check_notebook.py
