name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python: ["3.10", "3.12"]
        # The project claims to work across ultralytics releases that report loss items differently,
        # so the older shape is tested on every push rather than trusted.
        ultralytics: [locked, "8.4.101"]
    name: test (py${{ matrix.python }}, ultralytics ${{ matrix.ultralytics }})
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
          python-version: ${{ matrix.python }}
      - run: uv sync --group dev
      - name: Pin ultralytics
        if: matrix.ultralytics != 'locked'
        run: uv pip install "ultralytics==${{ matrix.ultralytics }}"
      - name: Lint
        if: matrix.ultralytics == 'locked'
        run: |
          uv run --no-sync ruff check .
          uv run --no-sync ruff format --check .
      - name: Test
        run: uv run --no-sync pytest -q

  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
          python-version: "3.12"
      - run: uv sync --group dev
      - name: Correctness checks on real runs
        run: uv run --no-sync python scripts/verify.py

  notebook:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
          python-version: "3.12"
      - run: uv sync --group dev
      - name: Execute the quick start on CPU
        run: uv run --no-sync python scripts/check_notebook.py
