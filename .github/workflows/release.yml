name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: true
      matrix:
        ultralytics: [latest, "8.4.101"]
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
          python-version: "3.12"
      - run: uv sync --group dev
      - name: Pin ultralytics
        if: matrix.ultralytics != 'latest'
        run: uv pip install "ultralytics==${{ matrix.ultralytics }}"
      - run: uv run --no-sync pytest -q

  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
          python-version: "3.12"
      - name: Check the tag names the package version
        # A tag that disagrees with the code would publish one version under another's name.
        if: github.ref_type == 'tag'
        run: |
          version=$(sed -n 's/^__version__ = "\(.*\)"$/\1/p' esmoe/__init__.py)
          [ "${GITHUB_REF_NAME#v}" = "$version" ] || { echo "tag $GITHUB_REF_NAME, esmoe $version"; exit 1; }
      - run: uv build
      - uses: actions/upload-artifact@v7
        with:
          name: dist
          path: dist/

  publish:
    needs: [build, test]
    # Flipped to 'true' once PyPI knows this workflow as a trusted publisher; until then a tag only builds.
    if: vars.PYPI_TRUSTED == 'true'
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write # trusted publishing: no API token is stored in this repository
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: dist
          path: dist/
      - uses: pypa/gh-action-pypi-publish@release/v1
        with:
          skip-existing: true
