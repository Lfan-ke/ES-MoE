site_name: ES-MoE
site_url: https://lfan-ke.github.io/ES-MoE/
site_description: Drop-in expert-sparse MoE block for Ultralytics YOLO, with a router loss that reaches the optimiser.
repo_url: https://github.com/Lfan-ke/ES-MoE
edit_uri: blob/main/docs/
# Kept under .github so the root holds only the package; both paths are relative to this file.
docs_dir: ../../docs
site_dir: ../../site

theme:
  name: material
  logo: assets/logo.svg
  favicon: assets/logo.svg
  font:
    text: Source Sans 3
    code: JetBrains Mono
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      toggle: { icon: material/weather-night, name: Dark mode }
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      toggle: { icon: material/weather-sunny, name: Light mode }
  features:
    - navigation.tabs
    - navigation.sections
    - navigation.top
    - navigation.footer
    - navigation.tracking
    - toc.follow
    - content.code.copy
    - content.tooltips
    - search.suggest
    - search.highlight

hooks:
  - urls.py
  - tables.py

extra_css:
  - stylesheets/extra.css

extra:
  version:
    provider: mike
    alias: true
    default: latest

plugins:
  - search
  # Ahead of i18n, which reads site_url: mike serves a version from <site_url>/<version>/. `latest` is
  # a copy, so the unversioned addresses redirected into it land on pages rather than on redirects.
  # The version selector stays on: Material draws its own only while mike's is enabled.
  - mike:
      alias_type: copy
  - i18n:
      docs_structure: suffix
      languages:
        - locale: zh
          default: true
          name: 中文
          build: true
        - locale: en
          name: English
          build: true
          nav_translations:
            概览: Overview
            试玩: Try it
            教程: Tutorial
            选型: Selection
            实验结果: Results
            效果图: Effect chart
            使用: Usage
            设计: Design
            实验: Experiments
            实验总览: Overview
            ES-MoE 与 YOLO: ES-MoE and YOLO
            判读线: Judgment lines
            发布说明: Release notes

nav:
  - 概览: index.md
  - 试玩: demo.md
  - 使用:
      - 教程: tutorial.md
      - API: API.md
  - 设计:
      - ES-MoE 与 YOLO: design.md
      - 选型: SELECTION.md
  - 实验:
      - 实验总览: experiments.md
      - 效果图: charts.md
      - 实验结果: results.md
      - 判读线: JUDGMENT.md
  - 发布说明: RELEASE.md

markdown_extensions:
  - admonition
  - attr_list
  - md_in_html
  - tables
  - toc:
      permalink: true
      toc_depth: 3
      slugify: !!python/object/apply:pymdownx.slugs.slugify
        kwds:
          case: lower
  - pymdownx.snippets:
      base_path: ['.']
  - pymdownx.arithmatex:
      generic: true
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid-chart
          format: !!python/name:pymdownx.superfences.fence_code_format

extra_javascript:
  - javascripts/data.js
  - javascripts/charts.js
  - javascripts/figures.js
  - javascripts/diagrams.js
  - javascripts/demo.js
  - javascripts/loader.js
