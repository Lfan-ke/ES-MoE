[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "esmoe"
version = "2.1.0"
description = "Expert-sparse MoE block for torch models and Ultralytics YOLO, with a router loss that reaches the optimiser."
readme = "README.md"
requires-python = ">=3.12"
license = "AGPL-3.0-only"
license-files = ["LICENSE"]
authors = [{ name = "Leo Cheng" }]
keywords = ["torch", "keras", "yolo", "ultralytics", "mixture-of-experts", "object-detection", "moe"]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Intended Audience :: Science/Research",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = ["torch>=2.0"]

[project.optional-dependencies]
torch = ["torch>=2.0"]
tensorflow = ["tensorflow>=2.17"]
jax = ["jax>=0.4.35"]
keras = ["keras>=3.5"]
yolo = ["ultralytics>=8.3"]
all = ["esmoe[torch]", "esmoe[tensorflow]", "esmoe[jax]", "esmoe[keras]", "esmoe[yolo]"]
pytorch = ["esmoe[torch]"]
tf = ["esmoe[tensorflow]"]
keras3 = ["esmoe[keras]"]
ultralytics = ["esmoe[yolo]"]

[project.scripts]
esmoe = "esmoe.cli:main"

[project.urls]
Homepage = "https://github.com/Lfan-ke/ES-MoE"
Documentation = "https://lfan-ke.github.io/ES-MoE/"
Source = "https://github.com/Lfan-ke/ES-MoE"
Issues = "https://github.com/Lfan-ke/ES-MoE/issues"

[dependency-groups]
check = ["pytest>=8"]
dev = [
    { include-group = "check" },
    "ruff>=0.9",
    "ultralytics>=8.3",
    "keras>=3.5",
    "mkdocs>=1.6,<2",  # MkDocs 2.0 drops the plugin system this site is built on
    "mkdocs-material>=9,<10",
    "mkdocs-static-i18n>=1.2",
    "mike>=2",
    "nbclient>=0.10",
    "ipykernel>=6",
    "marimo[recommended]>=0.17",
    "pandas>=2",
    # A PyPI torchvision against a CPU torch loses torchvision::nms on Linux, and only a direct
    # entry lets the index below apply to it.
    "torchvision",
    "onnx>=1.16",
    "onnxruntime>=1.17",
    "faster-coco-eval>=1.8.0",
]

# CPU wheels for local work and CI only; uv sources are stripped from the published metadata.
[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[tool.uv.sources]
torch = { index = "pytorch-cpu" }
torchvision = { index = "pytorch-cpu" }

[tool.setuptools.package-data]
esmoe = ["py.typed"]

[tool.setuptools.packages.find]
include = ["esmoe*"]

[tool.ruff]
line-length = 120
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.ruff.lint.per-file-ignores]
# A package gathers its layer with star imports, against each module's own __all__.
"esmoe/**/__init__.py" = ["F403", "F405"]
"esmoe/module.py" = ["F403"]
# A test skips itself on a missing extra before it imports against it.
"tests/*.py" = ["E402"]
# A marimo cell's last expression is the cell's output.
"notebooks/*.py" = ["B018"]
