[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "esmoe"
version = "0.1.1"
description = "Drop-in ES-MoE block for Ultralytics YOLO: installable, budget-fair, aux-loss aware."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "AGPL-3.0-only" }
authors = [{ name = "Leo Cheng" }]
keywords = ["yolo", "ultralytics", "mixture-of-experts", "object-detection", "moe"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: GNU Affero General Public License v3 or later (AGPLv3+)",
    "Programming Language :: Python :: 3",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = ["torch>=2.0", "ultralytics>=8.3"]

[project.scripts]
esmoe = "esmoe.__main__:main"

[project.urls]
Homepage = "https://github.com/Lfan-ke/ES-MoE"
Documentation = "https://lfan-ke.github.io/ES-MoE/"
Source = "https://github.com/Lfan-ke/ES-MoE"
Issues = "https://github.com/Lfan-ke/ES-MoE/issues"

[dependency-groups]
dev = [
    "pytest>=8",
    "ruff>=0.9",
    "mkdocs-material>=9",
    "nbclient>=0.10",
    "ipykernel>=6",
    "pandas>=2",
    # ultralytics pulls torchvision transitively, but only a direct entry lets the CPU index below
    # apply to it - a PyPI torchvision against a CPU torch loses torchvision::nms on Linux.
    "torchvision",
]

# CPU wheels for local work and CI only. uv sources are stripped from the published metadata, so
# installing esmoe never forces anyone onto a CPU build.
[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[tool.uv.sources]
torch = { index = "pytorch-cpu" }
torchvision = { index = "pytorch-cpu" }

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 120
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
